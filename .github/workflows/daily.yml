name: daily-run

on:
  schedule:
    # 17:03 JST = 08:03 UTC
    - cron: '3 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Keep scheduled workflow active
        run: |
          last_commit_ts=$(git log -1 --format=%ct)
          now_ts=$(date +%s)
          days_since_last_commit=$(( (now_ts - last_commit_ts) / 86400 ))

          echo "Days since last commit: ${days_since_last_commit}"

          if [ "${days_since_last_commit}" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit --allow-empty -m "chore: keep scheduled workflow active"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No keepalive commit needed."
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main.py
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          python main.py
